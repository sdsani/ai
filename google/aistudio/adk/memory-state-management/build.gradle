plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '9.8.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
}

application {
    mainClass = project.findProperty('mainClass') ?: 'com.shahkaar.App'
}

dependencies {
    // This dependency is used by the application.
    implementation 'com.google.adk:google-adk:1.12.0'
    // Spring Boot web application
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // SLF4J API & Implementation
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'

    // required for import com.google.genai.types.Schema;
    implementation("com.google.genai:google-genai:1.76.0")

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}



tasks.named('run', JavaExec) {
    standardInput = System.in
}